# Apply inside each existing HTTPS server block for chalakgo.com and
# admin.chalakgo.com. Keep the correct root, certificates and other settings.
# Replace the existing location / block; do not add a duplicate.
# Do NOT apply to api.chalakgo.com (that site proxies the Node API).
location / {
    try_files $uri $uri/ /index.html;
}

# Replace any existing exact matches for these files.
location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate" always;
}
location = /hash-route.js {
    add_header Cache-Control "no-cache, must-revalidate" always;
}
